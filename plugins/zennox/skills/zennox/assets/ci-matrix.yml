# Zennox CI matrix template (GitHub Actions). Copy to .github/workflows/ci.yml and trim
# the targets you don't ship. SECURITY: pin every third-party action to a full commit SHA
# (tags shown here for readability), keep default permissions read-only, and only expose
# signing secrets to the release job on tags.
name: ci
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
permissions:
  contents: read
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint && pnpm -r typecheck && pnpm -r test -- --run
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Dependency audit
        run: pnpm audit --audit-level=high

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      # PRs: smoke on chromium + one mobile project; main/tags: full matrix
      - run: pnpm exec playwright test ${{ github.event_name == 'pull_request' && '--project=chromium --project=mobile-safari' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report/, retention-days: 7 }

  desktop:
    needs: check
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'native')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04     # build Linux on the oldest glibc you support
          - os: windows-latest
          - os: macos-latest     # add --target universal-apple-darwin for universal builds
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "apps/desktop/src-tauri -> target" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop tauri build   # Electron: pnpm --filter desktop make
      - uses: actions/upload-artifact@v4
        with: { name: "desktop-${{ matrix.os }}", path: "apps/desktop/src-tauri/target/release/bundle/" }

  android:
    needs: check
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'native')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }   # check your AGP's required JDK
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mobile build:android    # e.g. expo prebuild + gradlew assembleRelease, or eas build --local

  ios:
    needs: check
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'native')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mobile build:ios        # e.g. xcodebuild / fastlane / eas build --local

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [e2e, desktop, android, ios]
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write }
    environment: production          # require manual approval in repo settings
    steps:
      - uses: actions/download-artifact@v4
      - run: echo "Sign, notarize, upload to stores/update feed here (see references/11-devops-deploy.md)"
